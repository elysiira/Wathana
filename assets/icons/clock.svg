<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Main purple / pink -->
    <linearGradient id="purplePink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b3bc4"/>
      <stop offset=".48" stop-color="#7861dd"/>
      <stop offset="1" stop-color="#ff8abb"/>
    </linearGradient>

    <linearGradient id="clockRing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b3cc1"/>
      <stop offset=".5" stop-color="#7560d9"/>
      <stop offset="1" stop-color="#ff83b7"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slight translucent white clock -->
    <radialGradient id="clockFace">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f2fa"/>
    </radialGradient>
  </defs>

  <!-- CLOCK OUTER RING -->
  <circle
    cx="500"
    cy="500"
    r="168"
    fill="none"
    stroke="url(#clockRing)"
    stroke-width="34"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Face -->
  <circle
    cx="500"
    cy="500"
    r="137"
    fill="url(#clockFace)"
  />

  <!-- Clock face subtle shadow -->
  <circle
    cx="500"
    cy="500"
    r="137"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    opacity=".8"
  />

  <!-- Ticks -->
  <g
    stroke="#7157cf"
    stroke-width="10"
    stroke-linecap="round"
  >
    <line x1="500" y1="377" x2="500" y2="397"/>
    <line x1="561" y1="393" x2="551" y2="411"/>
    <line x1="607" y1="439" x2="589" y2="449"/>
    <line x1="623" y1="500" x2="603" y2="500"/>
    <line x1="607" y1="561" x2="589" y2="551"/>
    <line x1="561" y1="607" x2="551" y2="589"/>
    <line x1="500" y1="623" x2="500" y2="603"/>
    <line x1="439" y1="607" x2="449" y2="589"/>
    <line x1="393" y1="561" x2="411" y2="551"/>
    <line x1="377" y1="500" x2="397" y2="500"/>
    <line x1="393" y1="439" x2="411" y2="449"/>
    <line x1="439" y1="393" x2="449" y2="411"/>
  </g>

  <!-- Arms -->
  <g
    stroke="url(#purplePink)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <line x1="500" y1="500" x2="500" y2="422"/>
    <line x1="500" y1="500" x2="557" y2="447"/>
  </g>

  <circle
    cx="500"
    cy="500"
    r="22"
    fill="#5140bd"
  />
</svg>
